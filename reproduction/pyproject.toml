[project]
name = "r4r-rebuild-scientific-contract"
version = "1.0.7"
dependencies = [
  "PyYAML==6.0.2",
  "jsonschema==4.24.0",
  "pytest==9.1.1",
  "osqp==1.1.3",
  "numpy==2.3.0",
  "pandas==2.3.0",
  "scipy==1.15.2",
  "dss-python==0.15.7",
  "cvxpy==1.9.1",
  "matplotlib==3.10.8",
  "openpyxl==3.1.5",
]
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
cache_dir = "tmp/pytest_cache"
